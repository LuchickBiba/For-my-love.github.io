<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#ffc2d1">
<meta name="robots" content="noindex">
<title>Для Юли 💌</title>
<style>
:root{--bg:#ffe3ea;--bg2:#ffc2d1;--ink:#5a1730;--card:#fffafb;--accent:#e63b6b;--env:#f7a8bd;--env2:#f48aa6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1b;--bg2:#431427;--ink:#ffe3ea;--card:#3a1624;--accent:#ff6b93;--env:#c7567a;--env2:#a93f62}}
:root[data-theme="dark"]{--bg:#2a0f1b;--bg2:#431427;--ink:#ffe3ea;--card:#3a1624;--accent:#ff6b93;--env:#c7567a;--env2:#a93f62}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:min(92vw,420px);text-align:center;position:relative}
.hint{margin-top:22px;font-size:15px;opacity:.75;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
/* envelope */
.env{position:relative;width:100%;aspect-ratio:3/2;background:var(--env);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .6s,opacity .6s}
.env::before{content:"";position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,transparent 49.6%,var(--env2) 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.6%,var(--env2) 50%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;top:0;width:100%;height:55%;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s}
.seal{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:76px;height:76px;border:0;background:none;font-size:68px;line-height:1;cursor:pointer;animation:beat 1.2s infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));z-index:2;padding:0}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.15)}}
.env.open .flap{transform:rotateX(180deg)}
.env.open{transform:translateY(40px) scale(.9);opacity:0;pointer-events:none}
.env.open .seal{display:none}
/* slides */
.slide{display:none;background:var(--card);border-radius:18px;padding:28px 22px;box-shadow:0 12px 30px rgba(0,0,0,.2);animation:pop .5s}
.slide.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.95)}}
h1{font-size:clamp(24px,7vw,32px);margin:6px 0 20px;line-height:1.25}
.cat{font-size:90px;line-height:1;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.btns{display:flex;flex-direction:column;gap:10px}
button.b{font:inherit;font-size:18px;padding:13px 16px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:transform .15s}
button.b:active{transform:scale(.96)}
button.b.alt{background:transparent;color:var(--accent)}
.row{display:flex;gap:10px}.row .b{flex:1}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="stage">
  <div class="env" id="env">
    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="Открыть">❤️</button>
  </div>
  <div class="hint" id="hint">Нажми на сердечко 💌</div>

  <section class="slide" id="s-ask">
    <h1>Юля,<br>я тебя люблю,<br>а ты меня?</h1>
    <div class="row">
      <button class="b" data-go="s-call">Да 💗</button>
      <button class="b alt" data-go="s-sad">Нет</button>
    </div>
  </section>

  <section class="slide" id="s-sad">
    <div class="cat">😿</div>
    <h1>Грустно мне…</h1>
    <div class="btns"><button class="b" data-go="s-ask">Я пошутила 😊</button></div>
  </section>

  <section class="slide" id="s-call">
    <div class="cat">🐱</div>
    <h1>Тогда давай созвонимся вечером в Дискорде?</h1>
    <div class="btns">
      <button class="b" data-go="s-end">Давай, конечно! 🎧</button>
      <button class="b alt" data-go="s-end">Только чур с котиками 🐾</button>
    </div>
  </section>

  <section class="slide" id="s-end">
    <div class="cat">😻</div>
    <h1>Люблю тебя ❤️</h1>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
function show(id){
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  if(id==='s-end')rain(40);
}
function rain(n){
  const h=$('hearts'),e=['❤️','💗','💖','💕','🐱'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+'%';
    s.style.fontSize=(18+Math.random()*26)+'px';
    s.style.animationDuration=(3+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*1.5)+'s';
    h.appendChild(s);
    setTimeout(()=>s.remove(),7000);
  }
}
$('seal').onclick=()=>{
  $('env').classList.add('open');
  $('hint').style.display='none';
  rain(14);
  setTimeout(()=>show('s-ask'),450);
};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
</script>
</body>
</html>
